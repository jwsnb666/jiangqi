<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>联机对战</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#3a2c1e,#150f09 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Yu Mincho","Hiragino Mincho ProN","Songti SC","SimSun",serif;color:#e8dcc8;padding:16px}
.wrap{display:flex;flex-direction:column;gap:10px;width:fit-content;max-width:100%}
.hand-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:40px;padding:6px 12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);border-radius:10px;justify-content:center}
.hand-label{font-size:14px;color:#b9a888;margin-right:4px;letter-spacing:1px}
.hand-empty{font-size:13px;color:#6b5c46}
.hand-piece{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:34px;padding:0 8px;background:linear-gradient(#f3ddb0,#dcb878);color:#2c1c08;border:2px solid #8b5e2a;border-radius:5px;font-size:14px;font-weight:700;user-select:none}
.hand-piece.disabled{opacity:.55}
.board-wrap{position:relative;display:flex;justify-content:center}
canvas{display:block;border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.7);max-width:96vw;height:auto;touch-action:manipulation}
.promo{position:absolute;transform:translate(-50%,-50%);display:flex;gap:8px;background:#241a10;padding:10px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.65);z-index:10}
.promo.hidden{display:none}
.promo button{font-family:inherit;font-size:19px;font-weight:700;padding:8px 16px;border-radius:7px;border:2px solid #c9a227;background:linear-gradient(#f3ddb0,#dcb878);color:#2c1c08;cursor:pointer}
.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 4px;flex-wrap:wrap}
#status{font-size:15px;letter-spacing:1px;text-align:center;width:100%}
#status.check{color:#ff8a6a}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button.act{font-family:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#e8dcc8;cursor:pointer}
button.act:hover{background:rgba(255,255,255,.16)}
button.act:disabled{opacity:.4;cursor:not-allowed}
#lobby{display:flex;flex-direction:column;gap:14px;padding:30px 36px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);align-items:center;max-width:96vw}
#lobby h2{margin:0;font-size:22px;letter-spacing:3px;color:#f3ddb0}
#lobby input{font-family:inherit;font-size:18px;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#e8dcc8;text-align:center;letter-spacing:4px;width:220px;max-width:100%}
#lobby .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#lobby button{font-family:inherit;font-size:16px;font-weight:700;padding:10px 22px;border-radius:8px;border:2px solid #c9a227;background:linear-gradient(#f3ddb0,#dcb878);color:#2c1c08;cursor:pointer}
#lobby button:hover{background:linear-gradient(#fff2d4,#e8c88c)}
#lobby .hint{font-size:13px;color:#b9a888;letter-spacing:1px;text-align:center;line-height:1.6}
.hidden{display:none!important}
#log{font-size:12px;color:#9a8a72;min-height:18px;text-align:center}
</style>
</head>
<body>
<div id="lobby">
<h2>联机对战</h2>
<input id="roomInput" maxlength="8" placeholder="房间号" autocomplete="off">
<div class="row">
<button id="createBtn">创建房间（先手）</button>
<button id="joinBtn">加入房间（后手）</button>
</div>
<div class="hint">创建后把房间号告诉对方<br>对方输入同一房间号点「加入房间」</div>
<div id="log"></div>
<button class="act" onclick="location.href='index.html'" style="margin-top:6px">主菜单</button>
</div>
<div class="wrap hidden" id="gameUI">
<div class="hand-row" id="hand-gote"></div>
<div class="board-wrap"><canvas id="board" width="560" height="560"></canvas><div class="promo hidden" id="promo"><button id="btn-promote">成（升变）</button><button id="btn-nopromote">不成</button></div></div>
<div class="hand-row" id="hand-sente"></div>
<div class="toolbar">
<div id="status">等待连接…</div>
<div class="btns">
<button class="act" id="undoBtn">请求悔棋</button>
<button class="act" id="restartBtn" disabled>重新开始</button>
<button class="act" id="leaveBtn">主菜单</button>
</div>
</div>
</div>
<script src="mqtt.min.js"></script>
<script src="sfx.js"></script>
<script>
const N=9,CELL=56,MARGIN=22,SIZE=N*CELL+MARGIN*2;
const PIECE_NAMES={K:'王将',R:'飛車',B:'角行',G:'金将',S:'銀将',N:'桂馬',L:'香車',P:'歩兵'};
const PROMOTED_NAMES={K:'王将',R:'龍王',B:'龍馬',G:'金将',S:'成銀',N:'成桂',L:'成香',P:'と金'};
const PROMOTABLE=new Set(['P','L','N','S','B','R']),DROPPABLE=['P','L','N','S','G','B','R'],HAND_ORDER=['R','B','G','S','N','L','P'];
const inside=(r,c)=>r>=0&&r<N&&c>=0&&c<N,cloneBoard=b=>b.map(row=>row.map(p=>p?{...p}:null));
function createBoard(){const b=Array.from({length:N},()=>Array(N).fill(null));const back=['L','N','S','G','K','G','S','N','L'];for(let c=0;c<N;c++){b[0][c]={type:back[c],owner:-1,promoted:false};b[8][c]={type:back[c],owner:1,promoted:false};}b[1][1]={type:'R',owner:-1,promoted:false};b[1][7]={type:'B',owner:-1,promoted:false};b[7][1]={type:'B',owner:1,promoted:false};b[7][7]={type:'R',owner:1,promoted:false};for(let c=0;c<N;c++){b[2][c]={type:'P',owner:-1,promoted:false};b[6][c]={type:'P',owner:1,promoted:false};}return b;}
function pieceName(p){if(p.type==='K')return p.owner===1?'王将':'玉将';return p.promoted?PROMOTED_NAMES[p.type]:PIECE_NAMES[p.type];}
function generatePieceMoves(board,r,c){const p=board[r][c];if(!p)return[];const owner=p.owner,f=-owner,base=p.type;const DIAG=[[-1,-1],[-1,1],[1,-1],[1,1]],ORTH=[[-1,0],[1,0],[0,-1],[0,1]],goldSteps=[[f,-1],[f,0],[f,1],[0,-1],[0,1],[-f,0]];let steps=[],slides=[];if(p.promoted&&['P','L','N','S'].includes(base))steps=goldSteps;else if(p.promoted&&base==='B'){slides=DIAG;steps=ORTH;}else if(p.promoted&&base==='R'){slides=ORTH;steps=DIAG;}else switch(base){case'P':steps=[[f,0]];break;case'L':slides=[[f,0]];break;case'N':steps=[[2*f,-1],[2*f,1]];break;case'S':steps=[[f,-1],[f,0],[f,1],[-f,-1],[-f,1]];break;case'G':steps=goldSteps;break;case'K':steps=[...DIAG,...ORTH];break;case'B':slides=DIAG;break;case'R':slides=ORTH;break;}const out=[];for(const[dr,dc]of steps){const nr=r+dr,nc=c+dc;if(!inside(nr,nc))continue;const t=board[nr][nc];if(t&&t.owner===owner)continue;out.push([nr,nc]);}for(const[dr,dc]of slides){let nr=r+dr,nc=c+dc;while(inside(nr,nc)){const t=board[nr][nc];if(t){if(t.owner!==owner)out.push([nr,nc]);break;}out.push([nr,nc]);nr+=dr;nc+=dc;}}return out;}
function inPromoZone(owner,r){return owner===1?r<=2:r>=6;}
function canPromote(p,fr,tr){if(p.promoted||!PROMOTABLE.has(p.type))return false;return inPromoZone(p.owner,fr)||inPromoZone(p.owner,tr);}
function mustPromote(p,tr){if(p.promoted)return false;const last=p.owner===1?0:8,sl=p.owner===1?1:7;if(p.type==='P'||p.type==='L')return tr===last;if(p.type==='N')return tr===last||tr===sl;return false;}
function findKing(board,owner){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=board[r][c];if(p&&p.owner===owner&&p.type==='K')return[r,c];}return null;}
function isInCheck(board,owner){const k=findKing(board,owner);if(!k)return true;const[kr,kc]=k;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=board[r][c];if(!p||p.owner!==-owner)continue;for(const[mr,mc]of generatePieceMoves(board,r,c))if(mr===kr&&mc===kc)return true;}return false;}
function applyMove(board,hands,move,owner){const nb=cloneBoard(board),nh={1:{...hands[1]},[-1]:{...hands[-1]}};if(move.drop){nb[move.to[0]][move.to[1]]={type:move.drop,owner,promoted:false};nh[owner][move.drop]=(nh[owner][move.drop]||0)-1;if(nh[owner][move.drop]<=0)delete nh[owner][move.drop];}else{const[fr,fc]=move.from,[tr,tc]=move.to,piece=nb[fr][fc],cap=nb[tr][tc];if(cap)nh[owner][cap.type]=(nh[owner][cap.type]||0)+1;nb[tr][tc]={type:piece.type,owner,promoted:piece.promoted||!!move.promote};nb[fr][fc]=null;}return{board:nb,hands:nh};}
function canDropAt(board,type,r,c,owner){if(board[r][c])return false;const last=owner===1?0:8,sl=owner===1?1:7;if((type==='P'||type==='L')&&r===last)return false;if(type==='N'&&(r===last||r===sl))return false;if(type==='P'){for(let rr=0;rr<N;rr++){const p=board[rr][c];if(p&&p.owner===owner&&p.type==='P'&&!p.promoted)return false;}}return true;}
function isLegalMove(board,hands,move,owner,nuf){const res=applyMove(board,hands,move,owner);if(isInCheck(res.board,owner))return false;if(!nuf&&move.drop==='P'){if(isInCheck(res.board,-owner)){if(!hasAnyLegalMove(res.board,res.hands,-owner,true))return false;}}return true;}
function hasAnyLegalMove(board,hands,owner,nuf){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=board[r][c];if(!p||p.owner!==owner)continue;for(const[tr,tc]of generatePieceMoves(board,r,c)){const must=mustPromote(p,tr),can=canPromote(p,r,tr);if(!must&&isLegalMove(board,hands,{from:[r,c],to:[tr,tc],promote:false},owner,nuf))return true;if(can&&isLegalMove(board,hands,{from:[r,c],to:[tr,tc],promote:true},owner,nuf))return true;}}for(const t of DROPPABLE){if(!hands[owner][t])continue;for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!canDropAt(board,t,r,c,owner))continue;if(isLegalMove(board,hands,{drop:t,to:[r,c]},owner,nuf))return true;}}return false;}
let board,hands,turn,selected,legalMoves,gameOver,statusText,lastMove,pendingPromotion;
let client=null,myRole=null,roomId=null,connected=false,opponentReady=false,undoPending=false,viewOwner=1,history=[];
let animating = null;
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1;
canvas.width=SIZE*dpr;canvas.height=SIZE*dpr;canvas.style.width=SIZE+'px';canvas.style.height=SIZE+'px';ctx.scale(dpr,dpr);
const promoEl=document.getElementById('promo');
window.getGameState = () => ({ board: board, turn: turn, animating: animating });
window.botMove = (fr, fc, tr, tc) => { doMove({ from: [fr, fc], to: [tr, tc], promote: false }, false); };
function hidePromo(){promoEl.classList.add('hidden');pendingPromotion=null;}
function log(msg){document.getElementById('log').textContent=msg;}
function initGame(){board=createBoard();hands={1:{},[-1]:{}};turn=1;selected=null;legalMoves=[];gameOver=false;statusText='';lastMove=null;pendingPromotion=null;history=[];animating=null;hidePromo();renderHands();updateStatus();draw();}
function seededRandom(i){const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x);}
function drawPiece(r,c,piece){
let cx=MARGIN+c*CELL+CELL/2,cy=MARGIN+r*CELL+CELL/2;
if(viewOwner===-1){cx=SIZE-cx;cy=SIZE-cy;}
const s=CELL*0.86;
ctx.save();ctx.translate(cx,cy);
let rot=(piece.owner===-viewOwner)?Math.PI:0;
ctx.rotate(rot);
const w=s*0.46,h=s*0.5;
ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=5;ctx.shadowOffsetY=2.5;
ctx.beginPath();ctx.moveTo(-w,h);ctx.lineTo(w,h);ctx.lineTo(w,-h*0.36);ctx.lineTo(0,-h);ctx.lineTo(-w,-h*0.36);ctx.closePath();
const grad=ctx.createLinearGradient(0,-h,0,h);grad.addColorStop(0,'#f7e5bd');grad.addColorStop(1,'#dcb878');ctx.fillStyle=grad;ctx.fill();
ctx.shadowColor='transparent';ctx.strokeStyle='#5a3a14';ctx.lineWidth=1.4;ctx.stroke();
ctx.restore();
ctx.save();ctx.translate(cx,cy);
ctx.fillStyle=piece.promoted?'#c0392b':'#2a1a06';
ctx.font=`700 ${Math.round(s*0.40)}px "Yu Mincho","SimSun",serif`;
ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pieceName(piece),0,0);
ctx.restore();
}
function draw(){
const bg=ctx.createLinearGradient(0,0,SIZE,SIZE);bg.addColorStop(0,'#eccb92');bg.addColorStop(.5,'#e2bd7e');bg.addColorStop(1,'#d3aa68');ctx.fillStyle=bg;ctx.fillRect(0,0,SIZE,SIZE);
ctx.save();ctx.globalAlpha=0.06;ctx.strokeStyle='#6b4a22';ctx.lineWidth=1;
for(let i=0;i<40;i++){const y=seededRandom(i)*SIZE,d1=seededRandom(i+100)*12-6,d2=seededRandom(i+200)*12-6;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(SIZE*.3,y+d1,SIZE*.7,y+d2,SIZE,y+2);ctx.stroke();}
ctx.restore();
ctx.strokeStyle='#7a5326';ctx.lineWidth=1.3;
for(let i=0;i<=N;i++){const p=MARGIN+i*CELL;ctx.beginPath();ctx.moveTo(MARGIN,p);ctx.lineTo(MARGIN+N*CELL,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,MARGIN);ctx.lineTo(p,MARGIN+N*CELL);ctx.stroke();}
ctx.lineWidth=2.6;ctx.strokeStyle='#5a3a14';ctx.strokeRect(MARGIN,MARGIN,N*CELL,N*CELL);
if(lastMove&&!animating){let[r,c]=lastMove.to;if(viewOwner===-1){r=N-1-r;c=N-1-c;}ctx.fillStyle='rgba(60,140,255,.22)';ctx.fillRect(MARGIN+c*CELL,MARGIN+r*CELL,CELL,CELL);}
if(selected&&selected.r!==undefined){let r=selected.r,c=selected.c;if(viewOwner===-1){r=N-1-r;c=N-1-c;}ctx.fillStyle='rgba(255,196,0,.42)';ctx.fillRect(MARGIN+c*CELL,MARGIN+r*CELL,CELL,CELL);}
const seen=new Set();
for(const m of legalMoves){const key=m.to[0]+','+m.to[1];if(seen.has(key))continue;seen.add(key);let[r,c]=m.to;if(viewOwner===-1){r=N-1-r;c=N-1-c;}const cx=MARGIN+c*CELL+CELL/2,cy=MARGIN+r*CELL+CELL/2;if(board[m.to[0]][m.to[1]]){ctx.beginPath();ctx.arc(cx,cy,CELL*0.42,0,Math.PI*2);ctx.strokeStyle='rgba(200,40,40,.8)';ctx.lineWidth=3;ctx.stroke();}else{ctx.beginPath();ctx.arc(cx,cy,CELL*0.14,0,Math.PI*2);ctx.fillStyle='rgba(40,110,40,.55)';ctx.fill();}}
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const p=board[r][c];if(p&&!(animating&&animating.to[0]===r&&animating.to[1]===c))drawPiece(r,c,p);}
if(animating){const t=Math.min((performance.now()-animating.start)/150,1);let drawR = animating.from[0] + (animating.to[0]-animating.from[0])*t;let drawC = animating.from[1] + (animating.to[1]-animating.from[1])*t;drawPiece(drawR,drawC,animating.piece);if(t<1)requestAnimationFrame(draw);else{finish();}}
}
function getLegalMovesFrom(r,c){const p=board[r][c];if(!p)return[];const res=[];for(const[tr,tc]of generatePieceMoves(board,r,c)){const must=mustPromote(p,tr),can=canPromote(p,r,tr);if(must){const m={from:[r,c],to:[tr,tc],promote:true};if(isLegalMove(board,hands,m,turn))res.push(m);}else{const m={from:[r,c],to:[tr,tc],promote:false};if(isLegalMove(board,hands,m,turn))res.push(m);if(can){const m2={from:[r,c],to:[tr,tc],promote:true};if(isLegalMove(board,hands,m2,turn))res.push(m2);}}}return res;}
function selectHandPiece(type,owner){if(gameOver||!opponentReady||turn!==owner||!hands[owner][type]||animating)return;selected={hand:type};legalMoves=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!canDropAt(board,type,r,c,turn))continue;const m={drop:type,to:[r,c]};if(isLegalMove(board,hands,m,turn))legalMoves.push(m);}renderHands();const st=document.getElementById('status');st.classList.remove('check');if(legalMoves.length===0){if(type==='P')st.textContent='二歩限制';else st.textContent='无合法打入点';}else st.textContent='选择落点';draw();if(window.SFX)SFX.play('select');}
function handleBoardClick(r,c){if(gameOver||!opponentReady||!inside(r,c)||animating)return;if(myRole===null||turn!==myRole)return;if(selected){const opts=legalMoves.filter(m=>m.to[0]===r&&m.to[1]===c);if(opts.length>0){if(opts.length>1)showPromoChoice(opts);else doMove(opts[0],false);return;}}const p=board[r][c];if(p&&p.owner===turn){selected={r,c};legalMoves=getLegalMovesFrom(r,c);renderHands();draw();if(window.SFX)SFX.play('select');}else{if(selected&&window.SFX)SFX.play('illegal');selected=null;legalMoves=[];renderHands();draw();}}
canvas.addEventListener('click',e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*(SIZE/rect.width),y=(e.clientY-rect.top)*(SIZE/rect.height);let r=Math.floor((y-MARGIN)/CELL),c=Math.floor((x-MARGIN)/CELL);if(viewOwner===-1){r=N-1-r;c=N-1-c;}handleBoardClick(r,c);});
function showPromoChoice(opts){pendingPromotion=opts;let[r,c]=opts[0].to;if(viewOwner===-1){r=N-1-r;c=N-1-c;}promoEl.style.left=(MARGIN+c*CELL+CELL/2)+'px';promoEl.style.top=(MARGIN+r*CELL+CELL/2)+'px';promoEl.classList.remove('hidden');}
document.getElementById('btn-promote').onclick=()=>{if(!pendingPromotion)return;const m=pendingPromotion.find(o=>o.promote);hidePromo();if(m)doMove(m,false);};
document.getElementById('btn-nopromote').onclick=()=>{if(!pendingPromotion)return;const m=pendingPromotion.find(o=>!o.promote);hidePromo();if(m)doMove(m,false);};
function doMove(move, fromRemote){
const captured=!move.drop&&!!board[move.to[0]][move.to[1]];
const prevBoard=cloneBoard(board),prevHands={1:{...hands[1]},[-1]:{...hands[-1]}},prevTurn=turn,prevLast=lastMove;
history.push({board:prevBoard,hands:prevHands,turn:prevTurn,lastMove:prevLast});
const res=applyMove(board,hands,move,turn);
board=res.board;hands=res.hands;lastMove=move;selected=null;legalMoves=[];turn=-turn;
const inCheck=isInCheck(board,turn);
const alive=hasAnyLegalMove(board,hands,turn,false);
if(!alive){gameOver=true;statusText=inCheck?`詰み！${turn===1?'後手':'先手'}的胜利 🎉`:`${turn===1?'後手':'先手'}无子可动，${turn===1?'先手':'後手'}获胜`;}
renderHands();updateStatus();
if(move.drop||fromRemote){ 
    execMove(move,captured,inCheck,alive,fromRemote);
}else{
    const piece=prevBoard[move.from[0]][move.from[1]];
    animating={from:move.from,to:move.to,piece,start:performance.now(),mv:move,captured,inCheck,alive,remote:fromRemote};
    requestAnimationFrame(draw);
}
}
function execMove(move,captured,inCheck,alive,fromRemote){
renderHands();updateStatus();draw();
if(window.SFX)SFX.play(SFX.classify({kind:move.drop?'drop':'move',capture:captured,promoted:!!move.promote,check:inCheck,checkmate:!alive}));
if(!fromRemote)sendMove(move);
}
function finish(){
if(!animating) return;
const{mv,captured,inCheck,alive,remote}=animating;
animating=null;
execMove(mv,captured,inCheck,alive,remote);
}
function sendMove(move){if(!client||!connected)return;const msg={type:'move',move,from:myRole};client.publish(`shogi/${roomId}/ctrl`,JSON.stringify(msg));}
function updateStatus(){const el=document.getElementById('status');el.classList.remove('check');if(!connected){el.textContent='未连接';return;}if(gameOver){el.textContent=statusText;return;}if(!opponentReady&&myRole===1){el.textContent='等待对手加入…';return;}const checked=isInCheck(board,turn),mine=turn===myRole;el.textContent=(mine?'你的回合':(turn===1?'先手回合':'後手回合'))+(checked?' · 王手！':'');if(checked)el.classList.add('check');}
function renderHands(){for(const owner of[1,-1]){const el=document.getElementById(owner===1?'hand-sente':'hand-gote');el.innerHTML='';const label=document.createElement('span');label.className='hand-label';label.textContent=owner===1?'先手 ▲':'後手 ▼';el.appendChild(label);let count=0;for(const t of HAND_ORDER){const n=hands[owner][t]||0;if(!n)continue;count++;const d=document.createElement('div');d.className='hand-piece'+(opponentReady&&owner===myRole&&turn===owner&&!gameOver&&!animating?'':' disabled');d.textContent=PIECE_NAMES[t]+(n>1?'×'+n:'');if(opponentReady&&owner===myRole&&turn===owner&&!gameOver&&!animating)d.onclick=()=>selectHandPiece(t,owner);el.appendChild(d);}if(count===0){const empty=document.createElement('span');empty.className='hand-empty';empty.textContent='（无持子）';el.appendChild(empty);}}}
function startGame(){document.getElementById('lobby').classList.add('hidden');document.getElementById('gameUI').classList.remove('hidden');initGame();}
function connectMQTT(topicRole,cb){const host='broker.emqx.io',port=8084,clientId='shogi_'+Math.random().toString(16).slice(2,10);const url=`wss://${host}:${port}/mqtt`;client=mqtt.connect(url,{clientId,keepalive:30,clean:true,connectTimeout:8000,reconnectPeriod:3000});client.on('connect',()=>{connected=true;log('已连接服务器');client.subscribe(`shogi/${roomId}/ctrl`,{qos:0});client.subscribe(`shogi/${roomId}/${topicRole}`,{qos:0});cb();});client.on('error',e=>{log('连接错误：'+e.message);});client.on('close',()=>{connected=false;log('连接已断开');});client.on('message',(topic,payload)=>{let msg;try{msg=JSON.parse(payload.toString());}catch(e){return;}handleMessage(msg);});}
function handleMessage(msg){
if(msg.type==='hello'){if(msg.role===myRole)return;opponentReady=true;if(myRole===1){client.publish(`shogi/${roomId}/ctrl`,JSON.stringify({type:'ready'}));}log('对手已加入');updateStatus();if(myRole===1){document.getElementById('restartBtn').disabled=false;}renderHands();draw();}
else if(msg.type==='ready'){opponentReady=true;log('对手已就绪');updateStatus();renderHands();draw();}
else if(msg.type==='move'){if(msg.from===myRole)return;doMove(msg.move,true);}
else if(msg.type==='restart'){if(myRole===1)return;initGame();log('房主重新开始了对局');updateStatus();}
else if(msg.type==='undo-req'){if(undoPending)return;undoPending=true;if(confirm('对方请求悔棋，是否同意？')){if(history.length>0){const h=history.pop();board=h.board;hands=h.hands;turn=h.turn;lastMove=h.lastMove;gameOver=false;statusText='';}client.publish(`shogi/${roomId}/ctrl`,JSON.stringify({type:'undo-ok'}));renderHands();updateStatus();draw();}else{client.publish(`shogi/${roomId}/ctrl`,JSON.stringify({type:'undo-no'}));}undoPending=false;}
else if(msg.type==='undo-ok'){if(history.length>0){const h=history.pop();board=h.board;hands=h.hands;turn=h.turn;lastMove=h.lastMove;gameOver=false;statusText='';}renderHands();updateStatus();draw();log('悔棋成功');}
else if(msg.type==='undo-no'){log('对方拒绝了悔棋请求');}
}
document.getElementById('createBtn').onclick=()=>{const id=document.getElementById('roomInput').value.trim();if(!id){log('请输入房间号');return;}roomId=id;myRole=1;viewOwner=1;log('创建房间 '+id+'，等待对手…');connectMQTT('sente',()=>{startGame();document.getElementById('status').textContent='等待对手加入…';document.getElementById('restartBtn').disabled=true;client.publish(`shogi/${roomId}/ctrl`,JSON.stringify({type:'hello',role:1}));});};
document.getElementById('joinBtn').onclick=()=>{const id=document.getElementById('roomInput').value.trim();if(!id){log('请输入房间号');return;}roomId=id;myRole=-1;viewOwner=-1;log('加入房间 '+id+'…');connectMQTT('gote',()=>{startGame();document.getElementById('status').textContent='已加入，等待房主开始…';client.publish(`shogi/${roomId}/ctrl`,JSON.stringify({type:'hello',role:-1}));});};
document.getElementById('undoBtn').onclick=()=>{if(!client||!connected||gameOver||!opponentReady)return;if(history.length===0){log('没有可悔的棋');return;}client.publish(`shogi/${roomId}/ctrl`,JSON.stringify({type:'undo-req'}));log('已发送悔棋请求，等待对方同意…');};
document.getElementById('restartBtn').onclick=()=>{if(myRole!==1||!client||!connected)return;initGame();client.publish(`shogi/${roomId}/ctrl`,JSON.stringify({type:'restart'}));log('已重新开始，已通知对手');};
document.getElementById('leaveBtn').onclick=()=>{if(client){try{client.end(true);}catch(e){}}location.href='index.html';};
document.addEventListener('pointerdown',()=>{if(window.SFX)SFX.init();},{once:true});
</script>
</body>
